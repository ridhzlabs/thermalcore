# ThermalCore - SmartTherm
# Goal: cool and efficient daily driver with no perceptible slowdown. Keeps
# vendor smart governors and their fast ramping, only trims sustained peak
# clocks (88% CPU / 80% GPU), quiets kswapd (lighter compaction, no watermark
# boost churn) and keeps file caches longer so apps reload less. Everyday speed
# stays balanced-class while the phone runs cooler and drains less.
CPU_GOVERNOR=smart
CPU_MAX_FREQ_PCT=88
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=smart
GPU_MAX_FREQ_PCT=80
GPU_MIN_FREQ_PCT=-1
IO_SCHEDULER=auto
IO_READ_AHEAD_KB=256
VM_SWAPPINESS=-1
VM_VFS_CACHE_PRESSURE=60
VM_DIRTY_RATIO=20
VM_DIRTY_BACKGROUND_RATIO=5
VM_COMPACTION_PROACTIVENESS=10
VM_WATERMARK_BOOST_FACTOR=0
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
