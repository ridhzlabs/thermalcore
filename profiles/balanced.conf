# ThermalCore - Balanced (default)
# Goal: vendor-optimal behaviour. Restores full clocks (undoes any cap) and
# keeps vendor smart governors (sugov_ext/schedutil/walt...) while replacing
# aggressive/battery governors. No I/O/VM meddling.
CPU_GOVERNOR=smart
CPU_MAX_FREQ_PCT=100
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=smart
GPU_MAX_FREQ_PCT=100
GPU_MIN_FREQ_PCT=-1
IO_SCHEDULER=auto
IO_READ_AHEAD_KB=-1
VM_SWAPPINESS=-1
VM_VFS_CACHE_PRESSURE=-1
VM_DIRTY_RATIO=-1
VM_DIRTY_BACKGROUND_RATIO=-1
VM_COMPACTION_PROACTIVENESS=-1
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
