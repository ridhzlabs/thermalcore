# ThermalCore - Balanced (default)
# Goal: vendor-optimal feel with a battery-lean edge. Smart vendor governors,
# gentle 95%/90% clock caps, lean writeback, no watermark boost churn.
CPU_GOVERNOR=smart
CPU_MAX_FREQ_PCT=95
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=smart
GPU_MAX_FREQ_PCT=90
GPU_MIN_FREQ_PCT=-1
IO_SCHEDULER=auto
IO_READ_AHEAD_KB=256
VM_SWAPPINESS=-1
VM_VFS_CACHE_PRESSURE=80
VM_DIRTY_RATIO=20
VM_DIRTY_BACKGROUND_RATIO=5
VM_COMPACTION_PROACTIVENESS=20
VM_WATERMARK_BOOST_FACTOR=0
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
