# ThermalCore - Battery Saver
# Goal: maximum endurance without stutter. Keeps vendor smart governors (no
# powersave lag), gentle 75%/60% caps, lean writeback, no background boost.
CPU_GOVERNOR=smart
CPU_MAX_FREQ_PCT=75
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=smart
GPU_MAX_FREQ_PCT=60
GPU_MIN_FREQ_PCT=-1
IO_SCHEDULER=auto
IO_READ_AHEAD_KB=256
VM_SWAPPINESS=60
VM_VFS_CACHE_PRESSURE=50
VM_DIRTY_RATIO=20
VM_DIRTY_BACKGROUND_RATIO=5
VM_COMPACTION_PROACTIVENESS=0
VM_WATERMARK_BOOST_FACTOR=0
SUGOV_UP_RATE_LIMIT_US=5000
SUGOV_DOWN_RATE_LIMIT_US=-1
