# ThermalCore - Battery Saver
# Goal: maximum endurance. Clocks capped, GPU conservative, I/O untouched,
# VM tuned for less swap I/O. Thermal load drops naturally via cpufreq caps.
CPU_GOVERNOR=powersave
CPU_MAX_FREQ_PCT=66
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=powersave
GPU_MAX_FREQ_PCT=50
GPU_MIN_FREQ_PCT=-1
IO_SCHEDULER=auto
IO_READ_AHEAD_KB=128
VM_SWAPPINESS=60
VM_VFS_CACHE_PRESSURE=50
VM_DIRTY_RATIO=-1
VM_DIRTY_BACKGROUND_RATIO=-1
VM_COMPACTION_PROACTIVENESS=-1
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
