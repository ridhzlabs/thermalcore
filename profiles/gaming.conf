# ThermalCore - Gaming
# Goal: sustained FPS + smooth frame pacing. Performance governor, full clocks,
# GPU floor raised to avoid ramp stutter, I/O latency minimised, swap avoided.
CPU_GOVERNOR=performance
CPU_MAX_FREQ_PCT=100
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=performance
GPU_MAX_FREQ_PCT=100
GPU_MIN_FREQ_PCT=30
IO_SCHEDULER=kyber
IO_READ_AHEAD_KB=512
VM_SWAPPINESS=20
VM_VFS_CACHE_PRESSURE=-1
VM_DIRTY_RATIO=-1
VM_DIRTY_BACKGROUND_RATIO=-1
VM_COMPACTION_PROACTIVENESS=5
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
