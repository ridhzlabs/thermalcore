# ThermalCore - Performance
# Goal: maximum responsiveness. Performance governor, full clocks,
# low-latency I/O scheduler, reduced swap tendency.
CPU_GOVERNOR=performance
CPU_MAX_FREQ_PCT=100
CPU_MIN_FREQ_PCT=-1
GPU_GOVERNOR=performance
GPU_MAX_FREQ_PCT=100
GPU_MIN_FREQ_PCT=20
IO_SCHEDULER=kyber
IO_READ_AHEAD_KB=512
VM_SWAPPINESS=30
VM_VFS_CACHE_PRESSURE=-1
VM_DIRTY_RATIO=-1
VM_DIRTY_BACKGROUND_RATIO=-1
VM_COMPACTION_PROACTIVENESS=10
VM_WATERMARK_BOOST_FACTOR=0
SUGOV_UP_RATE_LIMIT_US=-1
SUGOV_DOWN_RATE_LIMIT_US=-1
